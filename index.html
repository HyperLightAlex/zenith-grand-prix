<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#0b1020" />
    <!-- Added to a phone's home screen it opens full screen, without the browser round it. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Zenith GP</title>
    <!--
      The boot screen: race control's computer powering up while the game
      downloads. It is here, in the page, so it shows from the first moment;
      src/client/ui/boot.ts takes it over once the program has arrived and
      fills it with the real progress (one line per mech as its models land).
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; }
      .boot {
        --b-glass: #02060d;
        --b-phos: #45e8ff;
        --b-dim: color-mix(in srgb, var(--b-phos) 38%, transparent);
        --b-faint: color-mix(in srgb, var(--b-phos) 14%, transparent);
        --b-signal: #ff7a1a;
        --b-danger: #ff3d5a;
        --b-glow: 0 0 0.35em color-mix(in srgb, var(--b-phos) 70%, transparent);
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        padding: max(2.5vmin, env(safe-area-inset-top)) max(2.5vmin, env(safe-area-inset-right)) max(2.5vmin, env(safe-area-inset-bottom)) max(2.5vmin, env(safe-area-inset-left));
        background: #010307;
        color: var(--b-phos);
        font: 500 clamp(11px, 1.8vmin, 22px)/1.25 'Barlow Condensed', 'DIN Condensed', 'Arial Narrow', sans-serif;
        font-variant-numeric: tabular-nums;
        text-shadow: var(--b-glow);
        user-select: none; -webkit-user-select: none;
        box-sizing: border-box;
      }
      .boot *, .boot *::before, .boot *::after { box-sizing: border-box; }
      /* The tube: glass with scan lines and a bloom in the middle. */
      .boot-tube {
        position: relative; width: min(100%, 78em); height: min(100%, 44em);
        display: grid; grid-template-rows: auto 1fr auto; gap: 1.6em;
        padding: 1.4em 2em 1.8em;
        border: 1px solid var(--b-dim); border-radius: 1.2em;
        background:
          repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.32) 0 1px, transparent 1px 3px),
          radial-gradient(90% 70% at 50% 45%, var(--b-faint), transparent 75%),
          var(--b-glass);
        box-shadow: 0 0 2.4em var(--b-faint), inset 0 0 4em rgba(0, 0, 0, 0.7);
        overflow: hidden;
        animation: boot-on 0.45s ease-out both;
      }
      .boot-head { display: flex; justify-content: space-between; gap: 1em; padding-bottom: 0.5em; border-bottom: 1px solid var(--b-dim); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
      .boot-head b { color: var(--b-signal); font-weight: 600; text-shadow: 0 0 0.35em color-mix(in srgb, var(--b-signal) 60%, transparent); }
      .boot-main { display: grid; grid-template-columns: minmax(13em, 0.9fr) 1.6fr; gap: 3em; align-items: center; min-height: 0; }

      /* The scope: race control's frame scanner, the count in its middle. */
      .boot-scope { position: relative; justify-self: center; width: min(19em, 100%); aspect-ratio: 1; }
      .boot-scope svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--b-phos); filter: drop-shadow(0 0 0.25em var(--b-dim)); }
      .boot-scope .ring { stroke-width: 1.2; opacity: 0.7; }
      .boot-scope .ticks { stroke-width: 7; stroke-dasharray: 1.2 6.48; opacity: 0.55; transform-origin: 100px 100px; animation: boot-turn 40s linear infinite; }
      .boot-scope .inner { stroke-width: 1; stroke-dasharray: 3 5; opacity: 0.5; }
      .boot-scope .cross { stroke-width: 1.4; opacity: 0.8; }
      .boot-scope .sweep { position: absolute; inset: 3%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0deg 300deg, var(--b-faint) 330deg, color-mix(in srgb, var(--b-phos) 45%, transparent) 359deg, transparent 360deg); animation: boot-turn 2.6s linear infinite; }
      .boot-scope .readout { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 0.9em; }
      /* The count in the HUD's airbrushed chrome. */
      .boot-scope .readout b {
        font-size: 5.6em; font-weight: 800; font-style: italic; line-height: 1; letter-spacing: -0.02em;
        padding: 0 0.1em 0 0.04em;
        background: linear-gradient(180deg, #ffffff 6%, #c4e8ff 34%, #3b8cff 50%, #ff8a1f 58%, #ffc25a 94%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        -webkit-text-stroke: 0.03em #0d1630; text-shadow: none;
        filter: drop-shadow(0.04em 0.05em 0 #0d1630) drop-shadow(0 0 0.25em rgba(69, 232, 255, 0.35));
      }
      .boot-scope .readout i { font-size: 1.7em; font-weight: 700; font-style: italic; margin: -1.5em 0 0 0.08em; opacity: 0.85; }
      .boot-scope .units { position: absolute; left: 0; right: 0; bottom: 26%; text-align: center; font-size: 0.95em; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.85; }

      /* The log: lines from the top, the oldest scrolling off once it is full. */
      .boot-log { list-style: none; margin: 0; padding: 0; height: 15em; align-self: center; display: flex; flex-direction: column; gap: 0.32em; overflow: hidden; font-size: 1.3em; letter-spacing: 0.1em; text-transform: uppercase; }
      /* Once the oldest lines have scrolled off, the top of the screen fades. */
      .boot-log.full { -webkit-mask-image: linear-gradient(180deg, transparent, #000 4.5em); mask-image: linear-gradient(180deg, transparent, #000 4.5em); }
      .boot-log li { display: flex; gap: 0.6em; white-space: nowrap; animation: boot-type 0.22s steps(14) both; }
      .boot-log li span { display: flex; flex: 1; min-width: 0; overflow: hidden; }
      .boot-log li span::after { content: ''; flex: 1; min-width: 1.2em; margin: 0 0.1em 0.3em 0.6em; border-bottom: 0.14em dotted var(--b-dim); }
      .boot-log li:not(:has(em)) span::after { content: none; }
      .boot-log li em { font-style: normal; font-weight: 600; }
      .boot-log li.frame em { color: var(--b-signal); text-shadow: 0 0 0.35em color-mix(in srgb, var(--b-signal) 60%, transparent); }
      .boot-log li.now span::after, .boot-log li.now:not(:has(em)) span::after { content: '_'; flex: none; min-width: 0; margin: 0 0 0 0.15em; border: 0; animation: boot-cursor 0.8s steps(2) infinite; }
      .boot-log li.fail { color: var(--b-danger); text-shadow: 0 0 0.35em color-mix(in srgb, var(--b-danger) 60%, transparent); white-space: normal; }
      .boot-log li:nth-child(1) { animation-delay: 0.15s; }
      .boot-log li:nth-child(2) { animation-delay: 0.4s; }
      .boot-log li:nth-child(3) { animation-delay: 0.65s; }
      .boot-log li:nth-child(4) { animation-delay: 0.9s; }
      .boot.live .boot-log li { animation-delay: 0s; }

      /* Progress: the hangar computer's segmented meter. */
      .boot-bar { position: relative; height: 1.3em; background: repeating-linear-gradient(90deg, var(--b-faint) 0 0.75em, transparent 0.75em 1em); }
      .boot-bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--b-phos) 0 0.75em, transparent 0.75em 1em); filter: drop-shadow(0 0 0.3em var(--b-dim)); transition: width 0.25s steps(4); }
      /* Before the program has arrived there is nothing to count: one block runs along the meter. */
      .boot:not(.live) .boot-bar > i { width: 4em; animation: boot-seek 1.6s steps(16) infinite alternate; }

      .boot-retry { justify-self: start; margin-top: 0.4em; padding: 0.35em 1.2em; font: inherit; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--b-glass); background: var(--b-phos); border: 0; border-radius: 0.3em; box-shadow: 0 0 0.8em var(--b-dim); cursor: pointer; }
      .boot-retry:focus-visible { outline: 0.15em solid var(--b-signal); outline-offset: 0.2em; }

      /* Handing over: the tube switches off, down to a line and out. */
      .boot.off { pointer-events: none; animation: boot-fade 0.42s ease-in both; }
      .boot.off .boot-tube { animation: boot-off 0.36s ease-in both; }

      @keyframes boot-on { 0% { transform: scale(0.7, 0.01); filter: brightness(4); } 45% { transform: scale(1, 0.01); filter: brightness(3); } 100% { transform: none; filter: none; } }
      @keyframes boot-off { 0% { transform: none; filter: none; } 55% { transform: scale(1, 0.01); filter: brightness(3); } 100% { transform: scale(0, 0.01); filter: brightness(5); } }
      @keyframes boot-fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes boot-turn { to { transform: rotate(1turn); } }
      @keyframes boot-type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes boot-cursor { 50% { opacity: 0; } }
      @keyframes boot-seek { from { left: 0; } to { left: calc(100% - 4em); } }

      /* A phone held upright, or any tall window: the scope over the log. */
      @media (max-aspect-ratio: 1/1) {
        .boot { font-size: clamp(11px, 2.6vmin, 20px); }
        .boot-tube { height: 100%; padding: 1.2em 1.3em 1.5em; }
        .boot-main { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: center; gap: 2em; }
        .boot-scope { width: min(17em, 70%); }
        .boot-log { height: min(14em, 38vh); font-size: 1.2em; }
      }
      /* Short landscape screens (a phone on its side): a smaller scope and log. */
      @media (min-aspect-ratio: 1/1) and (max-height: 480px) {
        .boot-tube { gap: 1em; padding: 1em 1.4em 1.2em; }
        .boot-log { font-size: 1.15em; }
      }
      /*
        The studio's card, first of all, over the boot screen while the game
        downloads under it: Infinite Maybe Games, drawn by hand. The pen
        draws the infinity along its own line, from the middle round the left
        loop and back through the middle into the question mark's hook; a
        drop gathers at the end of the hook, drips and lands as the dot; the
        name comes up under it. A beat, the logo fades to black, the black
        lifts, and the boot screen powers on. Any key, pad button, click or
        tap skips it (and that press goes no further). Not for automated
        runs or the dev shortcuts (?ident=1 shows it anyway). The marks are
        the studio's own, and the pen's path and the ink's layers are worked
        out from them by tools/brand/layers.py (art/brand/), which writes
        them into the page itself so nothing has to be fetched. The drawing
        itself is the script below; this is the rest of the timing.
      */
      .ident { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; background: #000; }
      .ident.go { animation: ident-out 0.35s ease-out 3.65s both; }
      /* The logo out to black first, then the black lifts off the boot screen, which powers on once it has. */
      .ident.go .ident-logo { animation: ident-out 0.35s ease-in 3.3s both; }
      body:has(> .ident) .boot-tube { visibility: hidden; }
      /* (Nothing shows until its pictures are in: .go.) */
      .ident:not(.go) .ident-logo > * { opacity: 0; }
      .ident-logo { position: relative; width: min(78vw, 76vh, 640px); aspect-ratio: 1100 / 861; }
      .ident-logo > * { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
      .ident-logo canvas.ink { bottom: auto; }
      .ident-logo canvas.drip { inset: auto; }
      /* Drawn (the canvases), or where it cannot be (or should not move), the pictures as they are. */
      .ident.drawn .ident-logo :is(.ink1, .ink2, .dot), .ident:not(.drawn) .ident-logo canvas { visibility: hidden; }
      .ident.go.drawn .ident-logo canvas.ink { animation: ident-glow 1.7s ease-out 0.15s both; }
      .ident.go .ident-logo .words { animation: ident-words 0.6s ease-out 2.05s both; }
      .ident.skip { animation: ident-out 0.22s ease-in both; }
      @keyframes ident-glow { 0% { filter: drop-shadow(0 0 0.5em rgba(255, 255, 255, 0.5)); } 100% { filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); } }
      @keyframes ident-words { from { opacity: 0; transform: translateY(2.5%); } to { opacity: 1; transform: none; } }
      @keyframes ident-out { to { opacity: 0; visibility: hidden; } }

      @media (prefers-reduced-motion: reduce) {
        .ident.go { animation: ident-out 0.3s linear 1.9s both; }
        .ident.go .ident-logo canvas, .ident.go .ident-logo .words { animation: none; }
        .ident.go .ident-logo { animation: ident-words 0.4s linear 0.1s both; }
        .boot-tube, .boot-log li, .boot.off .boot-tube { animation: none; }
        .boot-scope .ticks, .boot-scope .sweep, .boot:not(.live) .boot-bar > i { animation: none; }
        .boot-log li.now span::after { animation: none; }
        .boot.off { animation: boot-fade 0.2s linear both; }
      }
    </style>
  </head>

    <script>
      // The studio's card: gone at its end, or at once on a key, pad button,
      // click or tap (which goes no further), and the boot screen under it
      // powers on again to be seen doing so. window.identDone says when
      // (ui/boot.ts waits for it before switching the boot screen off).
      (() => {
        const el = document.getElementById('ident');
        const q = new URLSearchParams(location.search);
        let done;
        let worker;
        window.identDone = new Promise((resolve) => (done = resolve));
        const end = () => {
          if (!el.isConnected) return;
          el.remove();
          worker?.terminate();
          removeEventListener('keydown', skip, true);
          removeEventListener('pointerdown', skip, true);
          const tube = document.querySelector('.boot-tube');
          if (tube) {
            tube.style.animation = 'none';
            void tube.offsetWidth;
            tube.style.animation = '';
          }
          done();
        };
        const skip = (e) => {
          e?.stopImmediatePropagation();
          if (el.classList.contains('skip')) return;
          el.classList.add('skip');
          setTimeout(end, 240);
        };
        const dev = ['auto', 'debug', 'tutorial', 'sprint', 'demo', 'skip'].some((k) => q.has(k));
        if ((navigator.webdriver || dev) && q.get('ident') !== '1') return end();

        // The drawing, in two canvases: the pen drawing the line, then the
        // drip. It runs in a worker where it can (the game is loading on this
        // thread meanwhile, in long stretches that would stall it), here
        // otherwise. Times are from the card starting (.go), in ms.
        //
        // The pen: the line is in two layers of ink, and each shows only
        // where a wide round-capped stroke along its stretch of the pen's
        // path has reached (its dash growing; the two keep step, the second
        // starting half a stroke before the first ends).
        //
        // The drip: distances to edges, in the canvas over the hook's end. A
        // drop swells out of the end of the hook, blended into it (a smooth
        // minimum of the two, so the liquid flares from the hook's own
        // outline), sags, pinches off as the blend lets go and wobbles still
        // in the dot's place; then it is the dot. The canvas holds only the
        // liquid beyond the line, so the line's own edge is never redrawn.
        const card = (scope) => {
          const PEN = [150, 1200];
          const DRIP = [1300, 1000];
          const clamp = (v) => Math.min(1, Math.max(0, v));
          const mix = (a, b, t) => a + (b - a) * t;
          const smooth = (t) => t * t * (3 - 2 * t);
          const bezier = (x1, y1, x2, y2) => (x) => {
            let t = x;
            for (let i = 0; i < 8; i++) {
              const e = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x;
              const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t;
              if (Math.abs(e) < 1e-6 || !d) break;
              t = clamp(t - e / d);
            }
            return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
          };
          const penEase = bezier(0.4, 0, 0.2, 1);
          const swell = bezier(0.2, 0.6, 0.35, 1);
          const sag = bezier(0.45, 0, 0.55, 1);
          const surface = (w, h) => (typeof OffscreenCanvas === 'function' ? new OffscreenCanvas(w, h) : Object.assign(document.createElement('canvas'), { width: w, height: h }));
          const now = () => performance.timeOrigin + performance.now();
          const frame = typeof requestAnimationFrame === 'function' ? (f) => requestAnimationFrame(f) : (f) => setTimeout(f, 16);
          let s;

          const setup = ({ ink, drip, bitmaps, spec, epoch }) => {
            const { scale, length, width, box, inkH } = spec;
            const [dx, dy, dr, yb] = spec.drip;
            const tail = spec.tail;
            const foot = tail.filter(([, y]) => y > yb - 1.5);
            const tx = foot.reduce((t, [x]) => t + x, 0) / foot.length;
            const pens = spec.pens.map(({ d, from }, i) => {
              const pts = d.slice(1).split(' ').map((p) => p.split(',').map(Number));
              let len = 0;
              for (let n = 1; n < pts.length; n++) len += Math.hypot(pts[n][0] - pts[n - 1][0], pts[n][1] - pts[n - 1][1]);
              return { path: new Path2D(d), from, len, bitmap: bitmaps[i] };
            });
            const ictx = ink.getContext('2d');
            const scratch = surface(ink.width, ink.height).getContext('2d');
            const dctx = drip.getContext('2d');
            const img = dctx.createImageData(drip.width, drip.height);
            const pix = new Uint32Array(img.data.buffer);
            const [x0, y0] = box;
            // Signed distance (negative inside) to the hook's end at every pixel of the drip's canvas.
            const hookD = new Float32Array(drip.width * drip.height);
            for (let j = 0; j < drip.height; j++) {
              const py = y0 + (j + 0.5) / scale;
              for (let i = 0; i < drip.width; i++) {
                const px = x0 + (i + 0.5) / scale;
                let best = Infinity;
                let inside = false;
                for (let n = 0, m = tail.length - 1; n < tail.length; m = n++) {
                  const [ax, ay] = tail[m];
                  const [bx, by] = tail[n];
                  const ex = bx - ax;
                  const ey = by - ay;
                  const t = clamp(((px - ax) * ex + (py - ay) * ey) / (ex * ex + ey * ey || 1));
                  best = Math.min(best, Math.hypot(px - ax - ex * t, py - ay - ey * t));
                  if (ay > py !== by > py && px < ax + ((py - ay) * ex) / ey) inside = !inside;
                }
                hookD[j * drip.width + i] = inside ? -best : best;
              }
            }
            s = { ink, drip, ictx, scratch, dctx, img, pix, hookD, pens, scale, length, width, inkH, x0, y0, dx, dy, dr, yb, tx, dot: bitmaps[2], epoch, last: [] };
          };

          const drawPen = (a) => {
            const { ictx, scratch, pens, scale, length, width, ink } = s;
            const at = penEase(a) * length;
            s.reached = at;
            ictx.setTransform(1, 0, 0, 1, 0, 0);
            ictx.clearRect(0, 0, ink.width, ink.height);
            ictx.setTransform(scale, 0, 0, scale, 0, 0);
            if (a >= 1) {
              // All drawn: the line itself.
              for (const k of pens) ictx.drawImage(k.bitmap, 0, 0, 1100, 861);
              return;
            }
            for (const k of pens) {
              const v = Math.min(k.len, at - k.from);
              if (v <= 0) continue;
              scratch.setTransform(1, 0, 0, 1, 0, 0);
              scratch.globalCompositeOperation = 'source-over';
              scratch.clearRect(0, 0, ink.width, ink.height);
              scratch.setTransform(scale, 0, 0, scale, 0, 0);
              scratch.strokeStyle = '#fff';
              scratch.lineCap = 'round';
              scratch.lineJoin = 'round';
              // The pen touching down: its stroke spreads to full over the first stretch.
              scratch.lineWidth = k === pens[0] ? width * (0.35 + 0.65 * smooth(clamp(at / 80))) : width;
              scratch.setLineDash([v, k.len + 999]);
              scratch.stroke(k.path);
              scratch.globalCompositeOperation = 'source-in';
              scratch.drawImage(k.bitmap, 0, 0, 1100, 861);
              ictx.setTransform(1, 0, 0, 1, 0, 0);
              ictx.drawImage(scratch.canvas, 0, 0);
              ictx.setTransform(scale, 0, 0, scale, 0, 0);
            }
          };

          // The drop at a point of the drip (0 to 1): centre, radius, stretch
          // across and down, and how far it blends into the hook (0: not at all).
          const dropAt = (b) => {
            const { tx, dx, dy, dr, yb } = s;
            const r0 = dr * 0.8;
            const hang = yb - r0 * 0.15;
            if (b < 0.3) {
              // Swelling out of the end.
              const e = swell(b / 0.3);
              const r = dr * mix(0.35, 0.8, e);
              return { x: tx, y: yb - r + r * 0.85 * e, r, sx: 1, sy: 1, k: dr * 0.55 };
            }
            if (b < 0.58) {
              // Hanging, heavier and longer.
              const e = sag((b - 0.3) / 0.28);
              return { x: mix(tx, dx, e * 0.6), y: mix(hang, dy - dr * 0.25, e), r: mix(r0, dr, e), sx: mix(1, 0.95, e), sy: mix(1, 1.14, e), k: dr * mix(0.55, 0.7, e) };
            }
            if (b < 0.74) {
              // Pulling away: the neck thins to a thread and lets go.
              const e = (b - 0.58) / 0.16;
              return { x: mix(tx, dx, 0.6 + 0.4 * e), y: mix(dy - dr * 0.25, dy - dr * 0.02, e), r: dr, sx: mix(0.95, 0.9, e), sy: mix(1.14, 1.2, e), k: dr * 0.7 * (1 - e) ** 1.2 };
            }
            // Free: it springs round, a little squat, a little long, still.
            const e = (b - 0.74) / 0.26;
            const w = 0.2 * (1 - e) ** 2 * Math.cos(3 * Math.PI * e);
            return { x: dx, y: mix(dy - dr * 0.02, dy, smooth(Math.min(1, e * 2.5))), r: dr, sx: 1 - w * 0.5, sy: 1 + w, k: 0 };
          };

          const drawDrip = (b) => {
            const { drip, dctx, img, pix, hookD, scale, x0, y0 } = s;
            if (s.reached < s.length - 12) b = 0;
            dctx.setTransform(1, 0, 0, 1, 0, 0);
            dctx.clearRect(0, 0, drip.width, drip.height);
            if (b <= 0) return;
            if (b >= 1) {
              // Landed and still: the dot itself.
              dctx.setTransform(scale, 0, 0, scale, -x0 * scale, -y0 * scale);
              dctx.drawImage(s.dot, 0, 0, 1100, 861);
              return;
            }
            const w = drip.width;
            const h = drip.height;
            const o = dropAt(b);
            const rx = o.r * o.sx;
            const ry = o.r * o.sy;
            for (let j = 0; j < h; j++) {
              const py = y0 + (j + 0.5) / scale - o.y;
              for (let i = 0; i < w; i++) {
                const px = x0 + (i + 0.5) / scale - o.x;
                // Distance to the drop (an ellipse, near enough).
                const k0 = Math.hypot(px / rx, py / ry);
                const k1 = Math.hypot(px / (rx * rx), py / (ry * ry));
                let d = (k0 * (k0 - 1)) / (k1 || 1e-6);
                const k = j * w + i;
                const e = hookD[k];
                // Blended into the hook's end.
                if (o.k > 0) {
                  const g = Math.max(o.k - Math.abs(d - e), 0) / o.k;
                  d = Math.min(d, e) - g * g * o.k * 0.25;
                } else d = Math.min(d, e);
                // Only where the liquid reaches beyond the line (drawn under
                // this, its own edge left alone elsewhere), and there over the
                // line's soft edge too, so no trace of that edge shows through.
                const a = clamp(0.5 - d * scale) * clamp(((e - d) * scale) / 1.5);
                pix[k] = ((a * 255) << 24) | 0xffffff;
              }
            }
            dctx.putImageData(img, 0, 0);
          };

          const render = () => {
            const t = s.fixed ?? now() - s.epoch;
            const a = clamp((t - PEN[0]) / PEN[1]);
            const b = clamp((t - DRIP[0]) / DRIP[1]);
            if (a !== s.last[0]) drawPen(a);
            if (a !== s.last[0] || b !== s.last[1]) drawDrip(b);
            s.last = [a, b];
            return a >= 1 && b >= 1;
          };
          const loop = () => {
            if (s.fixed === undefined && render()) return;
            frame(loop);
          };
          const message = (m) => {
            if (m.at === undefined) {
              setup(m);
              loop();
            } else if (s) {
              // (Held at a moment, for looking at frames: ?ident=1, el.identAt.)
              s.fixed = m.at;
              render();
            }
          };
          if (scope) scope.onmessage = (e) => message(e.data);
          return message;
        };

        const logo = el.querySelector('.ident-logo');
        const ink = el.querySelector('canvas.ink');
        const drip = el.querySelector('canvas.drip');
        const layers = ['ink1', 'ink2', 'dot'].map((c) => el.querySelector('img.' + c));
        const start = async () => {
          if (!el.isConnected) return;
          let drawn = !matchMedia('(prefers-reduced-motion: reduce)').matches && typeof createImageBitmap === 'function' && typeof Path2D === 'function';
          if (drawn) {
            try {
              const scale = (logo.getBoundingClientRect().width / 1100) * (devicePixelRatio || 1);
              const [dx, dy, dr, yb] = drip.dataset.drip.split(' ').map(Number);
              // The drip's box (in the logo's 1100 x 861): from a little above
              // the hook's end to under the dot, with room for its wobble.
              const box = [dx - dr * 1.35 - 4, yb - 70, dx + dr * 1.35 + 4, dy + dr * 1.25 + 4];
              const inkH = 480;
              Object.assign(drip.style, { left: box[0] / 11 + '%', top: box[1] / 8.61 + '%', width: (box[2] - box[0]) / 11 + '%', height: (box[3] - box[1]) / 8.61 + '%' });
              ink.style.height = inkH / 8.61 + '%';
              ink.width = Math.ceil(1100 * scale);
              ink.height = Math.ceil(inkH * scale);
              drip.width = Math.max(1, Math.ceil((box[2] - box[0]) * scale));
              drip.height = Math.max(1, Math.ceil((box[3] - box[1]) * scale));
              const spec = {
                scale,
                box,
                inkH,
                length: +ink.dataset.length,
                width: +ink.dataset.width,
                pens: [{ d: ink.dataset.pen1, from: 0 }, { d: ink.dataset.pen2, from: +ink.dataset.from2 }],
                drip: [dx, dy, dr, yb],
                tail: drip.dataset.tail.split(' ').map((p) => p.split(',').map(Number)),
              };
              const bitmaps = await Promise.all(layers.map((im) => createImageBitmap(im)));
              if (!el.isConnected) return;
              const epoch = performance.timeOrigin + performance.now();
              let send;
              if (typeof ink.transferControlToOffscreen === 'function' && typeof Worker === 'function') {
                try {
                  const offInk = ink.transferControlToOffscreen();
                  const offDrip = drip.transferControlToOffscreen();
                  worker = new Worker(URL.createObjectURL(new Blob(['(' + card + ')(self);'], { type: 'text/javascript' })));
                  // (Should it fail there, the pictures as they are.)
                  worker.onerror = () => {
                    drawn = false;
                    el.classList.remove('drawn');
                  };
                  worker.postMessage({ ink: offInk, drip: offDrip, bitmaps, spec, epoch }, [offInk, offDrip, ...bitmaps]);
                  send = (m) => worker.postMessage(m);
                } catch {
                  worker = undefined;
                }
              }
              if (!send) {
                send = card(null);
                send({ ink, drip, bitmaps, spec, epoch });
              }
              el.identAt = (t) => send({ at: t });
            } catch {
              drawn = false;
            }
          }
          el.classList.toggle('drawn', drawn);
          el.classList.add('go');
        };
        // It plays once its pictures are decoded (they are in the page, so at
        // once); if that fails or stalls, no card.
        Promise.all([...el.querySelectorAll('img')].map((im) => im.decode())).then(start, end);
        setTimeout(() => el.classList.contains('go') || end(), 1500);
        addEventListener('keydown', skip, true);
        addEventListener('pointerdown', skip, true);
        // A pad's button skips it too (the game's menus take no pad presses
        // while it is up: input.ts). A button already down when it started does not.
        const padDown = () => [...(navigator.getGamepads?.() ?? [])].some((p) => p?.buttons.some((b) => b.pressed));
        let held = padDown();
        const pads = () => {
          if (!el.isConnected) return;
          const now = padDown();
          if (now && !held) skip();
          held = now;
          requestAnimationFrame(pads);
        };
        requestAnimationFrame(pads);
        el.addEventListener('animationend', (e) => {
          if (e.target === el) end();
        });
      })();
    </script>
    <div id="boot" class="boot">
      <div class="boot-tube">
        <div class="boot-head"><span>Zenith race control</span><b>Frame link</b></div>
        <div class="boot-main">
          <div class="boot-scope" aria-hidden="true">
            <svg viewBox="0 0 200 200">
              <circle class="ring" cx="100" cy="100" r="99" />
              <circle class="ticks" cx="100" cy="100" r="88" />
              <circle class="inner" cx="100" cy="100" r="66" />
              <path class="cross" d="M100 -6v20M100 186v20M-6 100h20M186 100h20" />
            </svg>
            <div class="sweep"></div>
            <div class="readout"><b id="boot-pct">00</b><i>%</i></div>
            <div class="units" id="boot-count">Receiving</div>
          </div>
          <ol class="boot-log" id="boot-log" aria-hidden="true">
            <li><span>Power on</span></li>
            <li><span>Core memory</span><em>OK</em></li>
            <li><span>Phosphor test</span><em>OK</em></li>
            <li class="now"><span>Receiving race program</span></li>
          </ol>
        </div>
        <div class="boot-bar" id="boot-bar" role="progressbar" aria-label="Loading the mechs" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
